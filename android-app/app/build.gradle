plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace = 'vn.melodex.app'
    compileSdk 36

    defaultConfig {
        applicationId 'vn.melodex.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        def apiBase = providers.gradleProperty('API_BASE_URL').getOrElse('http://10.0.2.2:8080')
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBase + '"'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

