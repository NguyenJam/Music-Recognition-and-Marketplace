<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>List a release — Melodex</title><script>(()=>{try{const saved=localStorage.getItem('melodex-theme');const theme=saved==='dark'||saved==='light'?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==='dark'?'#181918':'#f4f1e9';}catch(e){}})();</script><link rel="stylesheet" th:href="@{/css/site.css(v='20261123-20')}">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark">m</span> melodex</a><details class="topbar-menu" open><summary class="menu-toggle" aria-label="Menu" data-i18n-aria="menu"><svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="sr-only" data-i18n="menu">Menu</span></summary><nav aria-label="Main navigation" data-i18n-aria="mainNavigation"><div class="nav-links"><a href="/catalogue" data-i18n="discover">Discover</a><a href="/#listen" data-i18n="identify">Identify a track</a><a class="nav-sell" href="/sell"><span data-i18n="sellRecord">List a record</span> <span aria-hidden="true">↗</span></a></div><div class="nav-controls"><div class="language-control"><svg class="language-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0-18"/></svg><button id="language-select" class="language-select" type="button" aria-label="Language and currency" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-options" data-i18n-aria="languageCurrency"><span class="language-current">English (US) · USD</span><svg class="language-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button><div id="language-options" class="language-options" role="listbox" aria-label="Language and currency" data-i18n-aria="languageCurrency" hidden><button class="language-option" type="button" role="option" tabindex="-1" data-locale-option="en-US" aria-selected="true">English (US) · USD</button><button class="language-option" type="button" role="option" tabindex="-1" data-locale-option="en-GB" aria-selected="false">English (UK) · GBP</button><button class="language-option" type="button" role="option" tabindex="-1" data-locale-option="vi-VN" aria-selected="false">Tiếng Việt · VND</button><button class="language-option" type="button" role="option" tabindex="-1" data-locale-option="es-ES" aria-selected="false">Español · EUR</button><button class="language-option" type="button" role="option" tabindex="-1" data-locale-option="fr-FR" aria-selected="false">Français · EUR</button><button class="language-option" type="button" role="option" tabindex="-1" data-locale-option="ja-JP" aria-selected="false">日本語 · JPY</button><button class="language-option" type="button" role="option" tabindex="-1" data-locale-option="ko-KR" aria-selected="false">한국어 · KRW</button><button class="language-option" type="button" role="option" tabindex="-1" data-locale-option="zh-CN" aria-selected="false">简体中文 · CNY</button></div></div><button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Dark mode" data-i18n-aria="darkMode"><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.4 8.4 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/></svg><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l-1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span class="sr-only theme-toggle-label" data-i18n="darkMode">Dark mode</span></button></div></nav></details></header>
  <main class="sell-main">
    <a class="back-link" href="/" data-i18n="backCatalogue">← Back to catalogue</a>
    <section class="sell-card">
      <p class="eyebrow" data-i18n="addShelf">ADD TO THE SHELF</p><h1 data-i18n="listRelease">List a release.</h1><p class="sell-intro" data-i18n="sellIntro">Choose a release, set its format and condition, then add your price.</p>
      <div class="notice notice-error" th:if="${error}" th:text="${error}"></div>
      <form class="sell-form" method="post" action="/sell">
        <label><span data-i18n="release">Release</span><select name="releaseId" required><option value="" data-i18n="chooseRelease">Choose a release</option><option th:each="release : ${releases}" th:value="${release.id}" th:text="${release.title + ' — ' + release.artist + ' (' + release.releaseYear + ')'}"></option></select></label>
        <label><span data-i18n="sellerName">Your seller name</span><input name="seller" maxlength="120" required data-i18n-placeholder="sellerPlaceholder" placeholder="e.g. Lantern Records"></label>
        <div class="form-pair"><label><span data-i18n="format">Format</span><select name="format" id="format-select" required><option th:each="itemFormat : ${formats}" th:value="${itemFormat}" th:text="${#strings.capitalize(#strings.toLowerCase(itemFormat))}"></option></select></label><label id="condition-field"><span data-i18n="condition">Condition</span><select name="condition" id="condition-select"><option th:each="condition : ${conditions}" th:value="${condition}" th:text="${condition == 'LIKE_NEW' ? 'Like new' : #strings.capitalize(#strings.toLowerCase(condition))}"></option></select></label></div>
        <label><span data-i18n="priceVnd">Price (VND)</span><input type="number" name="price" min="0" step="1000" required data-i18n-placeholder="pricePlaceholder" placeholder="e.g. 250000"><small data-i18n="priceEntryNote">Enter listing prices in VND. Displayed prices are converted for browsing.</small></label>
        <button class="button button-red" type="submit"><span data-i18n="addDemoListing">Add listing</span> <span aria-hidden="true">↗</span></button>
      </form>
    </section>
  </main>
  <footer class="footer"><a class="brand" href="/"><span class="brand-mark">m</span> melodex</a><span data-i18n="footerTagline">Find the track. Explore the release.</span><a href="/admin" data-i18n="admin">Admin</a></footer>
<script th:src="@{/js/i18n.js(v='20261123-4')}" defer></script>
  <script th:src="@{/js/preferences.js(v='20261123-5')}" defer></script>
<script th:src="@{/js/site.js(v='20261123-3')}" defer></script>
</body>
</html>
