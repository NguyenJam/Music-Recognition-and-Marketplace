spring.application.name=melodex
spring.config.import=optional:file:./application-private.properties,optional:file:../application-private.properties
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/music_marketplace}
spring.datasource.username=${DATABASE_USERNAME:music}
spring.datasource.password=${DATABASE_PASSWORD:music}
spring.sql.init.mode=always
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
music.recognition.rapidapi-key=${SHAZAM_RAPIDAPI_KEY:}
music.recognition.rapidapi-host=${SHAZAM_RAPIDAPI_HOST:shazam.p.rapidapi.com}

