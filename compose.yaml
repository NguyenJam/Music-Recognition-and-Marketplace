services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: music_marketplace
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
    ports:
      - "5432:5432"
    volumes:
      - melodex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_CONFIG_IMPORT: optional:file:/run/secrets/application-private.properties
      DATABASE_URL: jdbc:postgresql://db:5432/music_marketplace
      DATABASE_USERNAME: music
      DATABASE_PASSWORD: music
      SHAZAM_RAPIDAPI_HOST: ${SHAZAM_RAPIDAPI_HOST:-shazam.p.rapidapi.com}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - source: melodex-private
        target: application-private.properties
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

  catalogue-import:
    profiles: ["full-catalogue"]
    build:
      context: .
      dockerfile: infra/catalogue-import.Dockerfile
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: music_marketplace
      PGUSER: music
      PGPASSWORD: music
    depends_on:
      db:
        condition: service_healthy

secrets:
  melodex-private:
    file: ./application-private.properties

volumes:
  melodex-postgres:
