services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to the Neon pooled JDBC URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env to the Neon role}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      SHAZAM_RAPIDAPI_KEY: ${SHAZAM_RAPIDAPI_KEY:-}
      SHAZAM_RAPIDAPI_HOST: ${SHAZAM_RAPIDAPI_HOST:-shazam.p.rapidapi.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password123}
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    profiles: ["ci"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins-home:
