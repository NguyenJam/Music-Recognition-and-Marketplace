services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE must be set by deploy script}
    environment:
      SPRING_CONFIG_IMPORT: optional:file:/run/secrets/application-private.properties
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set by deploy script}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME must be set by deploy script}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set by deploy script}
      SHAZAM_RAPIDAPI_HOST: ${SHAZAM_RAPIDAPI_HOST:-shazam.p.rapidapi.com}
    expose:
      - "8080"
    secrets:
      - source: melodex-private
        target: application-private.properties
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - /opt/melodex/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

secrets:
  melodex-private:
    file: ${MELODEX_PRIVATE_CONFIG_FILE:?MELODEX_PRIVATE_CONFIG_FILE must be set}
